name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─── Backend: Python / FastAPI ───────────────────────────────────────────
  backend:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mednarrate-backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mednarrate
          POSTGRES_PASSWORD: mednarrate_pass
          POSTGRES_DB: mednarrate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mednarrate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: mednarrate-backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests (SQLite in-memory)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key-32-chars-min!!"
          GEMINI_API_KEY: ""
          UPLOAD_DIR: "uploads"
          ALGORITHM: "HS256"
          ACCESS_TOKEN_EXPIRE_MINUTES: "30"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
          ENVIRONMENT: "test"
        run: |
          PYTHONPATH=. pytest -v --tb=short

  # ─── Flutter ─────────────────────────────────────────────────────────────
  flutter:
    name: Flutter Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: "stable"

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test test/medication_card_test.dart test/biometric_service_test.dart test/insights_screen_test.dart test/offline_banner_test.dart --reporter expanded

  # ─── Docker build check ──────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mednarrate-backend:ci ./mednarrate-backend
