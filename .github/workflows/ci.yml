name: CI

on:
  push:
    branches: [main, develop, security-hardening]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: unit/integration tests on SQLite ───────────────────────────
  backend:
    name: Backend Tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mednarrate-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mednarrate-backend/requirements*.txt

      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          pip check

      - name: Run full test suite
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_SECRET: "ci-test-secret-key-32-chars-min!!"
          GEMINI_API_KEY: ""
          ENVIRONMENT: "test"
        run: PYTHONPATH=. pytest -q --tb=short

  # ─── Backend: real PostgreSQL (pgvector) — migrations + full suite ───────
  backend-postgres:
    name: Backend (PostgreSQL + Alembic)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mednarrate-backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: mednarrate
          POSTGRES_PASSWORD: mednarrate_pass
          POSTGRES_DB: mednarrate_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mednarrate -d mednarrate_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: "ci-test-secret-key-32-chars-min!!"
      GEMINI_API_KEY: ""
      ENVIRONMENT: "test"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mednarrate-backend/requirements*.txt

      - name: Install OCR system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils postgresql-client

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Alembic upgrade head (fresh PostgreSQL)
        env:
          DATABASE_URL: postgresql+asyncpg://mednarrate:mednarrate_pass@localhost:5432/mednarrate_db
        run: |
          alembic upgrade head
          alembic current
          HEADS=$(alembic heads | grep -c '(head)')
          echo "Alembic heads: $HEADS"
          test "$HEADS" -eq 1

      - name: Full migration round-trip
        env:
          DATABASE_URL: postgresql+asyncpg://mednarrate:mednarrate_pass@localhost:5432/mednarrate_db
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Start migrated API for HTTP smoke test
        env:
          DATABASE_URL: postgresql+asyncpg://mednarrate:mednarrate_pass@localhost:5432/mednarrate_db
          ANALYSIS_EXECUTION_MODE: worker
          RATE_LIMIT_ENABLED: "false"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/mednarrate-api-smoke.log 2>&1 &
          echo $! > /tmp/mednarrate-api-smoke.pid

      - name: Exercise real HTTP auth and isolation
        run: python scripts/smoke_http.py --require-migrations

      - name: Stop HTTP smoke server
        if: always()
        run: |
          if [ -f /tmp/mednarrate-api-smoke.pid ]; then
            kill "$(cat /tmp/mednarrate-api-smoke.pid)" || true
          fi

      - name: Create isolated test database
        env:
          PGPASSWORD: mednarrate_pass
        run: |
          psql -h localhost -U mednarrate -d mednarrate_db -c "CREATE DATABASE mednarrate_test;"
          psql -h localhost -U mednarrate -d mednarrate_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run full test suite on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://mednarrate:mednarrate_pass@localhost:5432/mednarrate_test
        run: pytest -q --tb=short

  # ─── Flutter ─────────────────────────────────────────────────────────────
  flutter:
    name: Flutter (analyze + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  mobile-simulator:
    name: Mobile UI (iPhone simulator)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.x"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - name: Boot available iPhone simulator
        id: simulator
        run: |
          DEVICE=$(xcrun simctl list -j devices available | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"].values(); d=next(d for group in groups for d in group if d["name"].startswith("iPhone") and d["isAvailable"]); print(d["udid"] + ":" + d["state"])')
          DEVICE_ID=${DEVICE%%:*}
          DEVICE_STATE=${DEVICE#*:}
          if [ "$DEVICE_STATE" != "Booted" ]; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Test native mobile auth flow
        run: flutter test integration_test/mobile_auth_smoke_test.dart -d "${{ steps.simulator.outputs.id }}"

  # ─── Admin portal (Next.js) ──────────────────────────────────────────────
  admin-frontend:
    name: Admin (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mednarrate-admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mednarrate-admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build
        env:
          MEDNARRATE_API_PROXY_URL: https://api.example.com

  admin-browser:
    name: Admin UI (Chromium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mednarrate-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mednarrate-admin/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: admin-browser-failures
          path: |
            mednarrate-admin/test-results
            mednarrate-admin/playwright-report

  # ─── Docker image checks ─────────────────────────────────────────────────
  docker:
    name: Docker Build + Hardening Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mednarrate-backend:ci ./mednarrate-backend

      - name: Runs as non-root
        run: |
          UID_IN_IMAGE=$(docker run --rm --entrypoint id mednarrate-backend:ci -u)
          echo "uid=$UID_IN_IMAGE"
          test "$UID_IN_IMAGE" != "0"

      - name: No secrets, databases or tests baked into the image
        run: |
          docker run --rm --entrypoint sh mednarrate-backend:ci -c '
            cd /app
            for p in .env tests scratch scratch2.py mednarrate.db pytest_output.txt; do
              if [ -e "$p" ]; then echo "UNEXPECTED in image: $p"; exit 1; fi
            done
            ls *.db 2>/dev/null && exit 1 || true
          '

  # ─── Security scanning ───────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit-js:
    name: Dependency Audit (npm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mednarrate-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Fail on high/critical production advisories
        run: npm audit --omit=dev --audit-level=high

  dependency-audit-python:
    name: Dependency Audit (pip-audit, advisory)
    runs-on: ubuntu-latest
    # Advisory: the pinned ML stack (torch/transformers/chromadb) has known advisories that need a
    # model-compatibility upgrade project. The report is published instead of blocking every PR.
    # Remove `continue-on-error` once those pins are upgraded.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - name: Audit
        run: pip-audit -r mednarrate-backend/requirements.txt --no-deps --disable-pip | tee pip-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit.txt

  release-gate:
    name: Automated release gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend
      - backend-postgres
      - flutter
      - mobile-simulator
      - admin-frontend
      - admin-browser
      - docker
      - secret-scan
      - dependency-audit-js
    env:
      BACKEND: ${{ needs.backend.result }}
      POSTGRES: ${{ needs.backend-postgres.result }}
      FLUTTER: ${{ needs.flutter.result }}
      MOBILE: ${{ needs.mobile-simulator.result }}
      ADMIN: ${{ needs.admin-frontend.result }}
      BROWSER: ${{ needs.admin-browser.result }}
      DOCKER: ${{ needs.docker.result }}
      SECRETS: ${{ needs.secret-scan.result }}
      NPM_AUDIT: ${{ needs.dependency-audit-js.result }}
    steps:
      - name: Require every automated check to pass
        run: |
          for result in "$BACKEND" "$POSTGRES" "$FLUTTER" "$MOBILE" "$ADMIN" "$BROWSER" "$DOCKER" "$SECRETS" "$NPM_AUDIT"; do
            if [ "$result" != "success" ]; then
              echo "A required check finished with: $result"
              exit 1
            fi
          done
