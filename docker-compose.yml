version: "3.8"

services:
  backend:
    build:
      context: ./mednarrate-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mednarrate_user:password@db:5432/mednarrate
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=mednarrate_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mednarrate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
