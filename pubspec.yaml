name: mednarrate
description: "AI Medical Report Analysis App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Fonts
  google_fonts: ^6.3.1

  # File Picker
  file_picker: ^10.3.2

  # Image Picker
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^12.0.1

  # Path Provider
  path_provider: ^2.1.5

  # UUID Generator
  uuid: ^4.6.0

  # PDF Viewer
  #syncfusion_flutter_pdfviewer: ^31.1.17

  # OCR
  google_mlkit_text_recognition: ^0.15.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Secure Storage (for tokens)
  flutter_secure_storage: ^10.3.1

  # Internationalization
  intl: ^0.20.2

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Timezone support (required by flutter_local_notifications)
  timezone: ^0.10.1

  # HTTP
  http: ^1.5.0

  # Charts
  fl_chart: ^1.2.0
  go_router: ^17.5.0

  # Text-to-Speech
  flutter_tts: ^4.2.0

  # PDF generation & export
  pdf: ^3.11.1
  printing: ^5.14.2

  # Native share sheet
  share_plus: ^10.0.3

  # Skeleton shimmer loading
  shimmer: ^3.0.0

  # SVG support for illustrations
  flutter_svg: ^2.0.10+1

  # Path utilities
  path: ^1.9.1

  # Forgot password token (secure random)
  crypto: ^3.0.5
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  app_settings: ^8.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  local_auth: ^3.0.2
  flutter_timezone: ^5.1.0
  dio: ^5.11.0
  sentry_flutter: ^8.14.2
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - lib/assets/images/
    - lib/assets/icons/
    - assets/sounds/