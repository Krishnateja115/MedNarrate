name: mednarrate
description: "AI Medical Report Analysis App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Fonts
  google_fonts: ^6.3.1

  # File Picker
  file_picker: ^10.3.2

  # Image Picker
  image_picker: ^1.1.2

  # Permissions
  permission_handler: ^12.0.1

  # Path Provider
  path_provider: ^2.1.5

  # UUID Generator
  uuid: ^4.5.1

  # PDF Viewer
  #syncfusion_flutter_pdfviewer: ^31.1.17

  # OCR
  google_mlkit_text_recognition: ^0.15.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Secure Storage (for tokens)
  flutter_secure_storage: ^9.2.2

  # Internationalization
  intl: ^0.20.2

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # Timezone support (required by flutter_local_notifications)
  timezone: ^0.9.4

  # HTTP
  http: ^1.5.0

  # Charts
  fl_chart: ^1.1.1
  go_router: ^17.5.0

  # Text-to-Speech
  flutter_tts: ^4.2.0

  # PDF generation & export
  pdf: ^3.11.1
  printing: ^5.14.2

  # Native share sheet
  share_plus: ^10.0.3

  # Skeleton shimmer loading
  shimmer: ^3.0.0

  # SVG support for illustrations
  flutter_svg: ^2.0.10+1

  # Path utilities
  path: ^1.9.1

  # Forgot password token (secure random)
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/
    - lib/assets/icons/